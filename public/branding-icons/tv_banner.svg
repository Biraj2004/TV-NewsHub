<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <!-- Background -->
  <rect width="1280" height="720" fill="#09090B"/>
  
  <!-- Left Antenna Emblem (Centered at X=268, Y=360) -->
  <g transform="translate(128, 220)">
    <rect x="0" y="0" width="280" height="280" rx="48" fill="#121217" stroke="#FFFFFF" stroke-width="10"/>
    <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <line x1="60" y1="110" x2="220" y2="110"/>
      <line x1="140" y1="170" x2="140" y2="230"/>
      <line x1="50" y1="150" x2="95" y2="70"/>
      <line x1="95" y1="150" x2="140" y2="70"/>
      <line x1="140" y1="150" x2="185" y2="70"/>
      <line x1="185" y1="150" x2="230" y2="70"/>
    </g>
  </g>

  <!-- Vertically Centered Text Block with Explicit Spacing -->
  <g transform="translate(460, 230)">
    <!-- Title Line 1 -->
    <text x="0" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="900" font-size="88" fill="#FFFFFF">TV-NewsHub</text>
    
    <!-- Subtitle Line 2 (Clean 75px Baseline Gap after Title) -->
    <text x="0" y="155" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" font-size="32" fill="#A1A1AA" letter-spacing="1">SMART TV LIVE NEWS ENGINE</text>
    
    <!-- Subtitle Line 3 (Clean 55px Baseline Gap after Subtitle 1) -->
    <text x="0" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="28" fill="#E4E4E7">1080p FULL HD • BENGALI &amp; GLOBAL</text>
  </g>

  <!-- Top-Right LIVE Pill Badge with 100% Symmetrical Left & Right Gaps -->
  <g transform="translate(942, 85)">
    <rect x="0" y="0" width="210" height="60" rx="30" fill="#121217" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="34" cy="30" r="9" fill="#FFFFFF"/>
    <text x="53" y="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" dominant-baseline="central">LIVE 1080p</text>
  </g>
</svg>